name: Build & Release Android APK

on:
  push:
    branches: [ master, feat/*, chore/*, fix/* ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Static Analysis & Tests
        run: |
          flutter analyze
          flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-remote-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.get_version.outputs.version }}
          name: "SSH Remote APK (${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.get_version.outputs.version }})"
          make_latest: true
          body: |
            ## 📱 SSH Remote Android APK (${{ steps.get_version.outputs.version }})
            Aplikasi mobile remote control VPS & monitor sistem via SSH.
            
            ### Changelog:
            - ⚡ **Optimasi Latensi Terminal:** Nagle's algorithm dimatikan (`tcpNoDelay`), transmisi karakter instan tanpa lag.
            - ⏸️ **Auto-Pause Background Polling:** Pemantau background otomatis berhenti saat masuk Terminal untuk menghemat bandwidth.
            - 🖥️ **Server Health Dashboard:** CPU, RAM, Disk, dan Uptime real-time.
            - ⚡ **Quick Actions:** Restart VPS (`sudo reboot`), restart services (Nginx, Docker).
            - 💻 **Interactive Terminal:** Shell xterm dengan keyboard accessory bar lengkap (`Esc`, `Tab`, `Ctrl+C`).
            - 🎨 **Tema Biru-Putih & Dark Mode:** Material 3 elegan.
            
            **Download file APK di bawah:**
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
